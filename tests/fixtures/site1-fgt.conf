#config-version=FGT90G-7.4.4-FW-build2662-240514:opmode=0:vdom=0:user=admin
config system global
    set hostname "SITE1-FGT"
end
config system interface
    edit "port1"
        set vdom "root"
        set type physical
        set alias "CORE-LAN"
    next
    edit "wan1"
        set vdom "root"
        set ip 203.0.113.10 255.255.255.248
        set type physical
        set role wan
    next
    edit "port6"
        set vdom "root"
        set type physical
        set status down
    next
    edit "port7"
        set vdom "root"
        set type physical
    next
    edit "port8"
        set vdom "root"
        set type physical
    next
    edit "fortilink"
        set vdom "root"
        set fortilink enable
        set ip 10.255.1.1 255.255.255.0
        set type aggregate
        set member "port7" "port8"
    next
    edit "core_data"
        set vdom "root"
        set ip 10.0.10.1 255.255.255.0
        set interface "port1"
        set vlanid 10
    next
    edit "core_voice"
        set vdom "root"
        set ip 10.0.20.1 255.255.255.0
        set interface "port1"
        set vlanid 20
    next
    edit "core_mgmt"
        set vdom "root"
        set ip 10.0.99.1 255.255.255.0
        set interface "port1"
        set vlanid 99
    next
    edit "vl10_data"
        set vdom "root"
        set ip 10.1.10.1 255.255.255.0
        set interface "fortilink"
        set vlanid 10
    next
    edit "vl20_voice"
        set vdom "root"
        set ip 10.1.20.1 255.255.255.0
        set interface "fortilink"
        set vlanid 20
    next
    edit "ssl.root"
        set vdom "root"
        set type tunnel
    next
end
config firewall policy
    edit 1
        set name "lan-out"
    next
end
config switch-controller managed-switch
    edit "S124FTF21000001"
        set name "SITE1-FSW01"
        set fsw-wan1-peer "fortilink"
        config ports
            edit "port1"
                set description "Reception PC"
                set vlan "vl10_data"
            next
            edit "port2"
                set status down
                set vlan "vl10_data"
            next
            edit "port3"
                set description "Phone"
                set vlan "vl10_data"
                set allowed-vlans "vl20_voice"
            next
            edit "port23"
                set vlan "_default"
            next
            edit "port24"
                set vlan "_default"
            next
            edit "port25"
                set vlan "_default"
            next
            edit "port26"
                set vlan "_default"
            next
            edit "__FoRtI1LiNk0__"
                set type trunk
                set members "port25" "port26"
            next
            edit "S124FTF21000002-0"
                set type trunk
                set members "port23" "port24"
            next
        end
    next
    edit "S124FTF21000002"
        set name "SITE1-FSW02"
        set fsw-wan1-peer "fortilink"
        config ports
            edit "port1"
                set description "Meeting room"
                set vlan "vl20_voice"
            next
            edit "port25"
                set vlan "_default"
            next
            edit "port26"
                set vlan "_default"
            next
            edit "__FoRtI1LiNk0__"
                set type trunk
                set members "port25" "port26"
            next
        end
    next
end
