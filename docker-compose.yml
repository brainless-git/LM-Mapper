services:
  lm-mapper:
    image: ghcr.io/brainless-git/lm-mapper:latest
    build: .
    container_name: lm-mapper
    restart: unless-stopped
    ports:
      - "8080:8080"
    env_file: .env
    volumes:
      - ./configs:/configs:ro
      - ./mapping:/mapping:ro
      - ./data:/data
    tmpfs:
      - /tmp
